<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5f8b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To-Do Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Jodi's To-Do Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Archivo:wght@600;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Jodi's To-Do Hub</h1>
      <div class="sub">Today shows what needs doing now.</div>
    </div>
    <div class="hd-r">
      <div class="sync" id="sync" role="status"></div>
      <button type="button" class="gear" id="gear">Sync settings</button>
    </div>
  </header>
  <div class="status" id="status" role="alert"></div>
  <nav id="tabs" aria-label="Pages"></nav>
  <main id="main"></main>
</div>
<script src="app.js"></script>
</body>
</html>
